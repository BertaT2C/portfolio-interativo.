<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" role="img" aria-labelledby="title desc">
<title id="title">Do caixa à máquina de refrigerante</title>
<desc id="desc">O atendente registra o pedido de exemplo 042 no PDV. O painel acompanha o preparo enquanto a máquina serve o refrigerante no copo.</desc>
<style>
.tap{transform-origin:154px 159px;animation:tap 10s infinite}
.pulse{stroke-dasharray:8 12;animation:signal 10s linear infinite}
.drop{stroke-dasharray:7 5;animation:pour 10s linear infinite}
.fill{transform-origin:408px 220px;animation:fill 10s linear infinite}
.received{animation:received 10s infinite}.preparing{animation:preparing 10s infinite}.ready{animation:ready 10s infinite}
@keyframes tap{0%,5%,30%,100%{transform:rotate(0)}10%,20%{transform:rotate(-15deg)}15%,25%{transform:rotate(4deg)}}
@keyframes signal{0%,21%,53%,100%{opacity:0}24%,49%{opacity:1;stroke-dashoffset:-55}50%{stroke-dashoffset:-125}}
@keyframes pour{0%,44%,79%,100%{opacity:0}46%,76%{opacity:1}77%{stroke-dashoffset:-110}}
@keyframes fill{0%,46%{transform:scaleY(.06)}76%,95%{transform:scaleY(1)}100%{transform:scaleY(.06)}}
@keyframes received{0%,37%{opacity:1}38%,100%{opacity:0}}
@keyframes preparing{0%,37%,78%,100%{opacity:0}38%,77%{opacity:1}}
@keyframes ready{0%,77%{opacity:0}78%,100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.tap,.pulse,.drop,.fill,.received,.preparing,.ready{animation:none}.pulse,.drop,.received,.preparing{opacity:0}.ready{opacity:1}}
</style>
<defs><pattern id="floor" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(27) skewX(-24)"><rect width="40" height="40" fill="#ecf1e8"/><path d="M0 0h20v20H0zm20 20h20v20H20z" fill="#d0dfd2"/></pattern><clipPath id="cup"><path d="M392 188h34l-5 33h-24z"/></clipPath></defs>
<rect width="560" height="290" rx="24" fill="#eaf2e7"/>
