 <path d="M177 135l43 6v33l-43-6z" fill="#2d4b43"/><path d="M183 142l30 4v17l-30-4z" fill="#a9d6b7"/><path d="M198 170v8m-10 2 22 3"/>
 <path d="M354 124l33-17 105 13-32 18z" fill="#a7bdb0"/><path d="M460 138l32-18v92l-32 18z" fill="#79958a"/>
 <rect x="354" y="125" width="107" height="105" rx="7" fill="#3a544b"/><rect x="371" y="149" width="70" height="73" rx="5" fill="#172f2a"/>
