<path d="M33 109l80 12v12l-80-12z" fill="#9e4c39"/>
<g stroke="#2f453c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
 <path d="M109 198v35m29-35v39" stroke-width="8"/><path d="M97 194v-32c0-14 11-22 25-22s25 8 25 22v32z" fill="#356953"/><circle cx="122" cy="123" r="17" fill="#dba678"/><path d="M105 121c0-18 30-24 35-3l-7 1-6-8-9 8z" fill="#333632"/>
 <path class="tap" d="M154 159l4 17 26-5" fill="none" stroke="#dba678" stroke-width="8"/>
