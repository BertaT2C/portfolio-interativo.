</g>
<path d="M221 155c53-44 81-12 119-21" fill="none" stroke="#587b69" stroke-width="3" stroke-dasharray="4 7"/>
<path class="pulse" d="M221 155c53-44 81-12 119-21" fill="none" stroke="#a16111" stroke-width="6" stroke-linecap="round"/>
<g font-family="system-ui,sans-serif">
 <rect x="278" y="17" width="252" height="88" rx="13" fill="#143c32"/><text x="298" y="40" font-size="12" font-weight="700" letter-spacing="2" fill="#e3eee3">PAINEL DE PEDIDOS</text>
 <text x="298" y="77" font-size="29" font-weight="800" fill="#ffe498">#042</text>
