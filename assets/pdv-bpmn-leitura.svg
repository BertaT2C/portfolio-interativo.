="101" fill="#173e35" font-size="15" font-weight="750">Suco · Uva ou laranja</text><text x="1112" y="121" fill="#425d51" font-size="11.8">Copo plástico · 300 / 500 mL</text></g><g><rect x="1100" y="194" width="190" height="62" rx="9" fill="#fff" stroke="#8aa695"/><text x="1112" y="219" fill="#173e35" font-size="15" font-weight="750">Refrigerante</text><text x="1112" y="239" fill="#425d51" font-size="11.8">Coca-Cola ou guaraná</text></g><g><rect x="1350" y="76" width="200" height="62" rx="9" fill="#fff" stroke="#8aa695"/><text x="1362" y="101" fill="#173e35" font-size="15" font-weight="750">Gelo para suco</text><text x="1362" y="121" fill="#425d51" font-size="11.8">12 pedras ou sem gelo</text></g><g><rect x="1350" y="194" width="200" height="62" rx="9" fill="#fff" stroke="#8aa695"/><text x="1362" y="219" fill="#173e35" font-size="15" font-weight="750">Gelo para refrigerante</text><text x="1362" y="239" fill="#425d51" font-size="11.8">Com gelo ou sem gelo</text></g><g><rect x="1350" y="348" width="200" height="62" rx="9" fill="#fff" stroke="#8aa695"/><text x="1362" y="373" fill="#173e35" font-size="15" font-weight="750">Preparar bebida</text><text x="1362" y="393" fill="#425d51" font-size="11.8">Encher o copo e atualizar o painel</text></g><g><rect x="1050" y="348" width="230" height="62" rx="9" fill="#e0eee1" stroke="#8aa695"/><text x="1062" y="373" fill="#173e35" font-size="15" font-weight="750">Modalidade de consumo</text><text x="1062" y="393" fill="#425d51" font-size="11.8">Restaurante ou delivery?</text></g><g><rect x="763" y="294" width="210" height="62" rx="9" fill="#fff" stroke="#8aa695"/><text x="775" y="319" fill="#173e35" font-size="15" font-weight="750">Restaurante</text><text x="775" y="339" fill="#425d51" font-size="11.8">Tampa com furo</text></g><g><rect x="763" y="410" width="210" height="62" rx="9" fill="#fff" stroke="#8aa695"/><text x="775" y="435" fill="#173e35" font-size="15" font-weight="750">Delivery</text><text x="775" y="455" fill="#425d51" font-size="11.8">Tampa sem furo</text></g><g><rect x="488" y="348" width="200" height="62" rx="9" fill="#fff" stroke="#8aa695"/><text x="500" y="373" fill="#173e35" font-size="15" font-weight="750">Aguardar retirada</text><text x="500" y="393" fill="#425d51" font-size="11.8">Temporizador de 10 segundos</text></g><g><rect x="40" y="348" width="395" height="62" rx="9" fill="#fff" stroke="#8aa695"/><text x="52" y="373" fill="#173e35" font-size="15" font-weight="750">Avisar e retirar a bebida</text><text x="52" y="393" fill="#425d51" font-size="11.8">Painel e BIP informam que o pedido está pronto</text></g>
