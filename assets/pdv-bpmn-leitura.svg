<title id="title">Fluxo de integração do PDV com a máquina ABS</title><desc id="desc">Redesenho vetorial das principais etapas e decisões do BPMN. O pedido sai do caixa, passa pela validação e pelo estoque, segue pelas regras da bebida e termina com o aviso de retirada.</desc>
